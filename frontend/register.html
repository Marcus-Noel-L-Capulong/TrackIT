<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TrackIT - Register</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .container { background: white; padding: 40px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h2 { text-align: center; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 14px; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; }
        button { width: 100%; padding: 12px; background-color: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; margin-top: 10px; }
        .success-message { color: #28a745; text-align: center; margin-top: 15px; display: none; }
        .login-link { text-align: center; margin-top: 20px; font-size: 14px; }
    </style>
</head>
<body>
<div class="container">
    <h2>Create an Account</h2>
    <form id="registrationForm">
        <div class="form-group">
            <label>User ID</label>
            <input type="text" id="userId" required>
        </div>
        <div class="form-group">
            <label>Full Name</label>
            <input type="text" id="name" required>
        </div>
        <div class="form-group">
            <label>Role</label>
            <select id="role" required>
                <option value="Student">Student</option>
                <option value="Instructor">Instructor</option>
            </select>
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="password" required>
        </div>
        <button type="submit">Register</button>
        <div class="login-link">Already have an account? <a href="login.html">Login here</a></div>
        <div id="successMessage" class="success-message"></div>
    </form>
</div>
<script src="auth.js"></script>
</body>
</html>
