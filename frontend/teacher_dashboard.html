<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Dashboard</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { display: flex; background-color: #f4f7f6; height: 100vh; }
        .sidebar { width: 250px; background-color: #343a40; color: white; padding: 20px; }
        .sidebar h2 { margin-bottom: 30px; font-size: 20px; }
        .content { flex: 1; padding: 40px; overflow-y: auto; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); max-width: 600px; }
        .form-group { margin-bottom: 15px; }
        label { font-weight: bold; display: block; margin-bottom: 5px; }
        input, select { width: 100%; padding: 8px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 4px; }
        button { background-color: #007bff; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        #statusMessage { margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>👨‍🏫 Instructor Panel</h2>
        <p id="welcomeName">Welcome, Teacher</p>
        <button onclick="logout()" style="margin-top: 20px; background: #dc3545;">Logout</button>
    </div>

    <div class="content">
        <h2>Record Daily Attendance</h2>
        <br>
        <div class="card">
            <form id="attendanceForm">
                <div class="form-group">
                    <label>Course ID</label>
                    <input type="text" id="courseId" placeholder="e.g., CS101" required>
                </div>
                <div class="form-group">
                    <label>Date</label>
                    <input type="date" id="date" required>
                </div>
                
                <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;">
                
                <div class="form-group">
                    <label>Student ID</label>
                    <input type="text" id="studentId" placeholder="e.g., S001" required>
                </div>
                <div class="form-group">
                    <label>Status</label>
                    <select id="status" required>
                        <option value="Present">Present</option>
                        <option value="Absent">Absent</option>
                        <option value="Late">Late</option>
                    </select>
                </div>

                <button type="submit">Submit Attendance</button>
                <div id="statusMessage"></div>
            </form>
        </div>
    </div>

    <script>
        // Check if user is actually logged in
        const user = JSON.parse(localStorage.getItem('currentUser'));
        if (!user || user.role !== 'Instructor') {
            // alert('Unauthorized! Please log in as an Instructor.');
            // window.location.href = 'login.html';
        } else {
            document.getElementById('welcomeName').innerText = `Welcome, ${user.name}`;
        }

        // Handle Form Submission
        document.getElementById('attendanceForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const messageDiv = document.getElementById('statusMessage');
            
            // Format data exactly how our Django backend expects it
            const payload = {
                course_id: document.getElementById('courseId').value,
                date: document.getElementById('date').value,
                records: [
                    {
                        student_id: document.getElementById('studentId').value,
                        status: document.getElementById('status').value
                    }
                ]
            };

            try {
                const response = await fetch('http://127.0.0.1:8000/api/attendance/record/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();
                
                if (response.ok || response.status === 201) {
                    messageDiv.style.color = 'green';
                    messageDiv.innerText = data.message || 'Attendance saved successfully!';
                } else {
                    messageDiv.style.color = 'red';
                    messageDiv.innerText = `Error: ${data.message}`;
                }
            } catch (err) {
                messageDiv.style.color = 'red';
                messageDiv.innerText = 'Failed to connect to the backend.';
            }
        });

        function logout() {
            localStorage.removeItem('currentUser');
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
