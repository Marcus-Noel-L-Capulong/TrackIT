<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrackIT - Student Dashboard</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #f4f7f6; padding: 20px; }
        .header { 
            background: #fff; 
            padding: 20px; 
            border-radius: 10px; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .user-info h1 { font-size: 24px; color: #333; }
        .user-info p { color: #666; }
        .logout-btn { 
            padding: 10px 20px; 
            background: #dc3545; 
            color: white; 
            border: none; 
            border-radius: 5px; 
            cursor: pointer; 
        }
        .stats-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .stat-card h3 { color: #666; font-size: 14px; text-transform: uppercase; }
        .stat-card p { font-size: 32px; font-weight: bold; color: #28a745; margin-top: 10px; }
        .stat-card.absent p { color: #dc3545; }

        .attendance-table {
            width: 100%;
            background: white;
            border-collapse: collapse;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .attendance-table th, .attendance-table td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }
        .attendance-table th { background-color: #f8f9fa; color: #333; }
        .status-present { color: #28a745; font-weight: bold; }
        .status-absent { color: #dc3545; font-weight: bold; }
    </style>
</head>
<body>

    <div class="header">
        <div class="user-info">
            <h1 id="welcomeName">Welcome, Student</h1>
            <p id="displayId">ID: Loading...</p>
        </div>
        <button class="logout-btn" onclick="logout()">Logout</button>
    </div>

    <div class="stats-container">
        <div class="stat-card">
            <h3>Attendance Rate</h3>
            <p id="attendanceRate">0%</p>
        </div>
        <div class="stat-card absent">
            <h3>Total Absences</h3>
            <p id="totalAbsences">0</p>
        </div>
    </div>

    <table class="attendance-table">
        <thead>
            <tr>
                <th>Date</th>
                <th>Course ID</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody id="attendanceBody">
            </tbody>
    </table>

    <script>
        // 1. Check if user is logged in
        const userId = localStorage.getItem('user_id');
        const userName = localStorage.getItem('user_name');
        const userRole = localStorage.getItem('user_role');

        if (!userId || userRole !== 'Student') {
            window.location.href = './login.html';
        }

        // 2. Update UI with local info
        document.getElementById('welcomeName').innerText = `Welcome, ${userName}`;
        document.getElementById('displayId').innerText = `Student ID: ${userId}`;

        // 3. Fetch Attendance from Django API
        async function fetchAttendance() {
            try {
                const response = await fetch(`http://127.0.0.1:8000/api/users/attendance/${userId}/`);
                const data = await response.json();

                if (response.ok) {
                    const tableBody = document.getElementById('attendanceBody');
                    tableBody.innerHTML = ''; // Clear loading state

                    document.getElementById('totalAbsences').innerText = data.total_absences;
                    
                    // Calculate rate if there's history
                    const totalRecords = data.history.length;
                    if (totalRecords > 0) {
                        const presentCount = data.history.filter(r => r.status === 'Present').length;
                        const rate = Math.round((presentCount / totalRecords) * 100);
                        document.getElementById('attendanceRate').innerText = `${rate}%`;
                    }

                    // Populate Table
                    data.history.forEach(record => {
                        const row = `
                            <tr>
                                <td>${record.date}</td>
                                <td>${record.course_id}</td>
                                <td class="status-${record.status.toLowerCase()}">${record.status}</td>
                            </tr>
                        `;
                        tableBody.innerHTML += row;
                    });
                }
            } catch (error) {
                console.error("Failed to fetch attendance:", error);
            }
        }

        function logout() {
            localStorage.clear();
            window.location.href = './login.html';
        }

        // Initialize
        fetchAttendance();
    </script>
</body>
</html>
